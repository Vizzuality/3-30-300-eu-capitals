<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three trees seen from above, as on the map: the 3 of 3-30-300 -->
  <style>
    .tile { fill: #f5f1e8; }
    .shadow { fill: #2e2a25; fill-opacity: 0.16; }
    .crown { fill: #66b98b; stroke: #5b7440; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #191714; }
      .shadow { fill: #000; }
      .crown { fill: #4fa879; stroke: #3d5130; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7" />
  <g class="shadow">
    <circle cx="17" cy="11" r="6.2" />
    <circle cx="10" cy="23" r="6.2" />
    <circle cx="24" cy="23" r="6.2" />
  </g>
  <g class="crown">
    <circle cx="16" cy="9.5" r="6.2" />
    <circle cx="9" cy="21.5" r="6.2" />
    <circle cx="23" cy="21.5" r="6.2" />
  </g>
</svg>
