# Plain console logging (one line per message), used through KEDRO_LOGGING_CONFIG (justfile).
version: 1
disable_existing_loggers: false
formatters:
  simple:
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
    datefmt: "%H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
loggers:
  kedro:
    level: INFO
  data_processing:
    level: INFO
  py.warnings:
    level: ERROR
root:
  handlers: [console]
  level: INFO
