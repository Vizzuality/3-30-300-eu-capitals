# The 27 capitals. A capital is the territory of the directly elected government whose remit is
# the capital city itself (in most capitals, the municipality). A capital runs only once its
# OpenStreetMap relation version is pinned (`osm_version`): the run fails if the relation has
# another version in the extract, so a boundary never changes without this file changing.
#
# - slug: path segment of the site and folder name in the release
# - osm_relation / osm_version: the administrative relation of the territory used
# - osm_subtract: relations cut out of that territory, each with its pinned version (only where
#   the relation is larger than the territory; see Nicosia)
# - osm_extract: the smallest Geofabrik region holding the city, its 1 km buffer and the 200 m
#   margin kept around green spaces (e.g. europe/sweden; Sweden has no smaller region); a list
#   when no single region holds them (the first holds the boundary)
# - context_extracts: the other Geofabrik regions that the capital's context rectangle (the
#   overview's water, context.pmtiles) crosses into, found from Geofabrik's index; those not on
#   disk are left out of the context and listed by the run, never downloaded by it
# - places: only where the rule for the overview's district names picks the wrong levels: the
#   two tiers, as `admin_level=<n>` or `place=<value>` (see the notes below); and `name_rules`,
#   to write the names as people say them: a regular expression (`pattern`), its `replace` and a
#   `note`, applied to every name of both tiers, in turn (`name_keep`: names left whole). Language rules for the names: the local
#   language; two languages where other maps such as OpenStreetMap display two (OSM's `name`:
#   Brussels' "Ixelles - Elsene"); never more unless official in the city. So the names are
#   OSM's `name`, no `name:xx` is added, and a rule never drops a language
# - wikidata / country_wikidata: the Wikidata items of the territory and of its country; their
#   labels are the names in the 24 languages
# - name_wikidata: only where the territory's item is named after something else than the city
#   (Brussels: the region): the item whose labels name the city, the one the city's OpenStreetMap
#   place node (capital=yes) links to with its `wikidata` tag
# - name_overrides: only where a Wikidata label is not the plain name of the city ("City of …"):
#   the plain name, from the `name:<locale>` tag of the city's OpenStreetMap place node
# - language: language of local names (street and park names), for the `lang` attribute
#
# Every relation was checked against the territory it must be (area against the official area,
# outline, holes and exclaves) for the extract of 2026-10-11. Notes:
# - amsterdam: the municipality including Weesp (merged in 2022), an exclave east of Diemen; the
#   IJ, IJmeer and Markermeer are lakes in OpenStreetMap, so nothing is cut as sea. Its analysis
#   area reaches into the provinces of Utrecht and Flevoland, hence three extracts.
# - bratislava: the city's buffer crosses into Austria and Hungary, hence three extracts.
# - brussels: the Brussels-Capital Region (all 19 municipalities), not the City of Brussels. It is
#   named as the city, Brussels (Q239, the item of OpenStreetMap's place node 1635651356), not as
#   the region (Q240); Irish from the node's name:ga, Wikidata's ga label being "Cathair na
#   Bruiséile" (the City of Brussels).
# - copenhagen: Copenhagen Municipality; Frederiksberg is an inner ring of the relation (a hole),
#   and the sea forts are separate parts.
# - nicosia: the municipality merged in 2024 (relation 17716182 is exactly the union of the former
#   municipalities of Nicosia 2628521, Agios Dometios 2628523, Engomi 2628524 and Aglantzia
#   15022747) minus the United Nations Buffer Zone (relation 3263909), which the municipality does
#   not govern; it reaches no further north than the buffer zone.
# - luxembourg: Maltese from the place node's name:mt (node 52943358), Wikidata's mt label being
#   "Belt tal-Lussemburgu" (the City of Luxembourg).
# - stockholm: district names from place=suburb (the 116 stadsdelar), then place=neighbourhood:
#   its admin_level 9 gives the 11 stadsdelsområden, administrative names ("Södermalms
#   stadsdelsområde"), not the names people use.
# - prague: district names from place=suburb (the 112 cadastral areas: Vinohrady, Smíchov,
#   Žižkov), then place=neighbourhood: its admin levels 5 and 6 are the numbered administrative
#   districts ("obvod Praha 1", "SO Praha 13").
# - vilnius: district names from place=suburb (Senamiestis, Naujamiestis), then place=quarter: its
#   admin_level 10 names are the seniūnijos ("Senamiesčio seniūnija"), administrative names.
# - zagreb: district names from place=suburb (Trešnjevka, Trnje), then place=neighbourhood: its
#   admin levels 9 and 10 are named "Gradska četvrt …" and "Mjesni odbor …".
# - vienna: the 23 Bezirke (admin_level 9), then place=suburb: its admin_level 10 is the
#   cadastral communities ("Katastralgemeinde Neubau").
# - dublin: district names from place=suburb, all 58: its admin levels 9 and 10 are electoral
#   divisions ("Grangegorman East"), not the names people use.
# - athens: district names from place=neighbourhood (Plaka, Kolonaki): its admin_level 10 names
#   are "Συνοικία …" ("district of …").
# - rome: district names from place=quarter (the quartieri: Parioli, Trieste), then
#   place=neighbourhood: its admin_level 10 is the 15 municipi, numbered ("Municipio Roma II").
# - paris: district names shortened to the arrondissement's number ("18e", "1er"), and the
#   quartiers without "Quartier", their article kept where French uses it ("La Roquette", "Les
#   Halles", "Belleville"); kept whole where the short name would mislead (`name_keep`:
#   "Quartier d'Amérique" and "Quartier de l'Europe" would read as continents, "Quartier de la
#   Gare" and "Quartier du Combat" as a station and a fight).
# - bratislava: district names without the city's name ("Bratislava-Petržalka" → "Petržalka").
# - rome: Roma Capitale, with its exclave to the north-west and Vatican City as a hole.
locales: [bg, cs, da, de, el, en, es, et, fi, fr, ga, hr, hu, it, lt, lv, mt, nl, pl, pt, ro, sk, sl, sv]

