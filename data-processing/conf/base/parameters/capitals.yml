# The 27 capitals. A capital is the territory of the directly elected government whose remit is
# the capital city itself (in most capitals, the municipality). A capital runs only once its
# OpenStreetMap relation version is pinned (`osm_version`): the run fails if the relation has
# another version in the extract, so a boundary never changes without this file changing.
#
# - slug: path segment of the site and folder name in the release
# - osm_relation / osm_version: the administrative relation of the territory used
# - osm_extract: the smallest Geofabrik region holding the city, its 1 km buffer and the 200 m
#   margin kept around green spaces (e.g. europe/sweden; Sweden has no smaller region)
# - wikidata / country_wikidata: names in the 24 languages (Wikidata labels)
# - language: language of local names (street and park names), for the `lang` attribute
#
# Only Stockholm is pinned and checked so far. The others carry the relation ids found while
# choosing the boundaries and their Wikidata ids; both must be verified, the version pinned and
# the Geofabrik region set before they are run.
locales: [bg, cs, da, de, el, en, es, et, fi, fr, ga, hr, hu, it, lt, lv, mt, nl, pl, pt, ro, sk, sl, sv]

capitals:
