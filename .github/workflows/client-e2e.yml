name: "Client: end-to-end tests"

on:
  push:
    branches: [main]
    paths:
      - client/**
      - .github/actions/setup-client/**
      - .github/workflows/client-e2e.yml
  pull_request:
    paths:
      - client/**
      - .github/actions/setup-client/**
      - .github/workflows/client-e2e.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The reduced-motion flows, split across four runners with one browser each:
  # the map draws on the processor, so a runner cannot share it between two
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-client

      # Against a production build, in the runner's Google Chrome
      - name: End-to-end tests
        run: pnpm test:e2e --project=desktop --project=phone --shard=${{ matrix.shard }}/4

      - name: Keep the report of failing tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: client/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the results of failing tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-shard-${{ matrix.shard }}
          path: client/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The tests about an animation itself (@motion), with motion on, one at a
  # time on a runner of their own, alongside the shards
  e2e-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-client

      - name: End-to-end tests with motion
        run: pnpm test:e2e --project="desktop, with motion" --project="phone, with motion"

      - name: Keep the report of failing tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-motion
          path: client/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the results of failing tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-motion
          path: client/test-results/
          retention-days: 7
          if-no-files-found: ignore
