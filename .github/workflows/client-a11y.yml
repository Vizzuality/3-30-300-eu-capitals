name: "Client: accessibility tests"

on:
  push:
    branches: [main]
    paths:
      - client/**
      - .github/actions/setup-client/**
      - .github/workflows/client-a11y.yml
  pull_request:
    paths:
      - client/**
      - .github/actions/setup-client/**
      - .github/workflows/client-a11y.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-client

      # In the runner's Google Chrome
      - name: Accessibility tests
        run: pnpm test:a11y

      - name: Keep the screenshots of failing tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-screenshots
          path: client/tests/a11y/**/__screenshots__/
          retention-days: 7
          if-no-files-found: ignore
